<div class="pagina-ricerca-cer">
  <mat-card class="scheda-ricerca-cer">
    <mat-card-header>
      <mat-card-title>Filtro Ricerca CER</mat-card-title>
      <mat-card-subtitle>
        Inserisci uno o piu criteri per filtrare le comunita energetiche
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="formRicerca" (ngSubmit)="inviaModulo()" class="form-ricerca">

        <div class="riga-form">
          <mat-form-field appearance="outline">
            <mat-label>Ragione Sociale</mat-label>
            <input matInput formControlName="ragioneSociale" type="text" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Partita IVA</mat-label>
            <input matInput formControlName="partitaIVA" type="text" />
          </mat-form-field>
        </div>

        <div class="riga-form">
          <mat-form-field appearance="outline">
            <mat-label>Scegli Forma Giuridica</mat-label>
            <mat-select formControlName="formaGiuridica">
              <mat-option value="">Tutte</mat-option>
              <mat-option
                *ngFor="let formaGiuridicaDisponibile of elencoFormaGiuridica"
                [value]="formaGiuridicaDisponibile"
              >
                {{ formaGiuridicaDisponibile }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" *ngIf="mostraSpecFormaGiuridica; else campoComune">
            <mat-label>Specifiche forma giuridica</mat-label>
            <input matInput formControlName="specFormaGiuridica" type="text" />
          </mat-form-field>

          <ng-template #campoComune>
            <mat-form-field appearance="outline">
              <mat-label>Comune</mat-label>
              <input matInput formControlName="comune" type="text" />
            </mat-form-field>
          </ng-template>
        </div>

        <div class="riga-form" *ngIf="mostraSpecFormaGiuridica">
          <mat-form-field appearance="outline">
            <mat-label>Comune</mat-label>
            <input matInput formControlName="comune" type="text" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Provincia</mat-label>
            <input matInput formControlName="provincia" type="text" />
          </mat-form-field>
        </div>

        <div class="riga-form">
          <mat-form-field appearance="outline" *ngIf="!mostraSpecFormaGiuridica">
            <mat-label>Provincia</mat-label>
            <input matInput formControlName="provincia" type="text" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Regione</mat-label>
            <input matInput formControlName="regione" type="text" />
          </mat-form-field>
        </div>

        <div class="riga-pulsanti">
          <button mat-stroked-button type="button" (click)="resetFiltri()">
            Pulisci filtri
          </button>

          <button mat-raised-button color="primary" type="submit">
            Cerca
          </button>
        </div>
      </form>

      <div class="risultati-ricerca">
        <h3>Risultati</h3>

        <div class="stato-caricamento" *ngIf="caricamento">
          <mat-spinner diameter="34"></mat-spinner>
          <span>Caricamento dati in corso...</span>
        </div>

        <app-tabella-cer
          *ngIf="!caricamento && ricercaEseguita"
          class="risultato-item"
          [risultatiFiltrati]="risultatiFiltrati"
        >
        </app-tabella-cer>
      </div>
    </mat-card-content>
  </mat-card>
</div>

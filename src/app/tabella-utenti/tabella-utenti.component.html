<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">
    <!-- Position Column -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let ele">{{ ele.nome }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="cognome">
      <th mat-header-cell *matHeaderCellDef>Cognome</th>
      <td mat-cell *matCellDef="let ele">{{ ele.cognome }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="codiceFiscale">
      <th mat-header-cell *matHeaderCellDef>Codice Fiscale</th>
      <td mat-cell *matCellDef="let ele">{{ ele.codiceFiscale }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="numeroTelefono">
      <th mat-header-cell *matHeaderCellDef>Numero di Telefono</th>
      <td mat-cell *matCellDef="let ele">{{ ele.numeroTelefono }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="ruolo">
      <th mat-header-cell *matHeaderCellDef>Ruolo</th>
      <td mat-cell *matCellDef="let ele">{{ ele.ruolo }}</td>
    </ng-container>
    

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  
  <button
    *ngIf="getRuolo() === 'ADMIN'"
    routerLink="/user/new"
  >
  Inserisci
  </button>
  

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
  >
  </mat-paginator>
</div>

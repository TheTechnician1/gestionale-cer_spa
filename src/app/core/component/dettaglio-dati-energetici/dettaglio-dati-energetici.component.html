<h4>Dettaglio Dati Energetici</h4>
<form [formGroup]="datiEnergeticiForm">
  <div class="flex-container">
    <div class="flex-col">
      <mat-card>
        <div class="section-box">
          <div class="section-title">DATI CER</div>
          <div class="field-group">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Anno</mat-label>
              <input matInput formControlName="anno" aria-label="anno" required>
            </mat-form-field>
          </div>
        </div>
        <div class="section-box">
          <div class="section-title">ENERGIA</div>
          <div class="field-group">
            <div class="row">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Energia Prodotta</mat-label>
                <input matInput type="number" formControlName="energia_prodotta" aria-label="energia_prodotta" required>
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Energia Prelevata</mat-label>
                <input matInput type="number" formControlName="energia_prelevata" aria-label="energia_prelevata" required>
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Energia Immessa</mat-label>
                <input matInput type="number" formControlName="energia_immessa" aria-label="energia_immessa" required>
              </mat-form-field>
            </div>
            <div class="row">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Energia Condivisa</mat-label>
                <input matInput type="number" formControlName="energia_condivisa" aria-label="energia_condivisa" required>
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Energia Autoconsumate</mat-label>
                <input matInput type="number" formControlName="energia_autoconsumata" aria-label="energia_autoconsumata"required>
              </mat-form-field>
            </div>
          </div>
        </div>
      </mat-card>
    </div>
    <div class="flex-col">
      <mat-card>
        <div class="section-box">
          <div class="section-title">PREMI</div>
          <div class="field-group">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Tarifa Premio</mat-label>
              <input matInput formControlName="tariffa_premio" aria-label="tariffa_premio" required>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Corrispettivo Premio</mat-label>
              <input matInput formControlName="corrispettivo_premio" aria-label="corrispettivo_premio" required>
            </mat-form-field>
          </div>
        </div>
        <div class="section-box">
          <div class="section-title">RIDUZIONI</div>
          <div class="field-group">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Riduzione Emissione</mat-label>
              <input matInput formControlName="riduzione_emissione" aria-label="riduzione_emissione" required>
            </mat-form-field>
          </div>
        </div>
      </mat-card>
    </div>
  </div>
</form>

<div class="configurazioni">
  <h3>Configurazioni</h3>
  <div class="filtro" rows="3">
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Codice Cabina</mat-label>
      <input [(ngModel)]="filtro.codice_cabina" matInput type="text" aria-label="codice_cabina">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Anno Attivazione</mat-label>
      <input [(ngModel)]="filtro.anno_attivazione" matInput type="text" aria-label="anno_attivazione">
    </mat-form-field>
    <div class="button-filtro">
      <button mat-raised-button color="primary" type="button" value="Cerca" aria-label="Cerca" (click)="filtraConfigurazione()">
        <mat-icon>search</mat-icon> Ricerca
      </button>
      <button mat-raised-button type="button" (click)="resetFiltro()">
        <mat-icon>close</mat-icon> Reset
      </button>
    </div>
  </div>
  <div>
    <button mat-raised-button color="primary" routerLink="inserimento-configurazione"><mat-icon>add</mat-icon> Aggiungi Configurazione</button>
    <button mat-raised-button routerLink="/impianto"><mat-icon>bolt</mat-icon> Impianti</button>
  </div>
</div>
<div class="table">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="id_configurazione">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id_configurazione}} </td>
    </ng-container>
    <ng-container matColumnDef="codice_cabina">
      <th mat-header-cell *matHeaderCellDef> COD.Cabina </th>
      <td mat-cell *matCellDef="let element"> {{element.codice_cabina}} </td>
    </ng-container>
    <ng-container matColumnDef="anno_attivazione">
      <th mat-header-cell *matHeaderCellDef> Anno Attivazione</th>
      <td mat-cell *matCellDef="let element"> {{element.anno_attivazione}} </td>
    </ng-container>
    <ng-container matColumnDef="azioni">
      <th mat-header-cell *matHeaderCellDef> Azioni </th>
      <td mat-cell *matCellDef="let element">
        <mat-button-toggle-group name="butt" aria-label="butt">
          <mat-button-toggle>
            <mat-icon color="primary">search</mat-icon>
          </mat-button-toggle>
          <mat-button-toggle>
            <mat-icon color="primary">settings</mat-icon>
          </mat-button-toggle>
          <mat-button-toggle (click)="deleteConf()">
            <mat-icon color="primary">delete</mat-icon>
          </mat-button-toggle>
        </mat-button-toggle-group>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="tableConf"></tr>
    <tr mat-row *matRowDef="let row; columns: tableConf;"></tr>
  </table>
    <mat-paginator [length]="100"
              [pageSize]="10"
              [pageSizeOptions]="[5, 10, 25, 100]"
              aria-label="Select page">
    </mat-paginator>
</div>
<router-outlet></router-outlet>

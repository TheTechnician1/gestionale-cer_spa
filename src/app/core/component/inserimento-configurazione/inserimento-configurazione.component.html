<h4>Inserimento Configurazione</h4>
  <form [formGroup]="configForm" (ngSubmit)="submit()">
      <div class="flex-container">
        <div class="flex-col">
          <mat-card>
            <div class="section-box">
              <div class="section-title">DATI CONFIGURAZIONE</div>
              <div class="field-group">
                <div class="row">
                  <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Codice Cabina</mat-label>
                    <input matInput formControlName="codiceCabina" aria-label="codiceCabina" required>
                      <mat-error *ngIf="configForm.get('codiceCabina')?.invalid && (configForm.get('codiceCabina')?.touched || submitted)">
                        Campo obbligatorio
                      </mat-error>
                  </mat-form-field>
                  <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Anno Attivazione</mat-label>
                    <input matInput formControlName="annoAttivazione" aria-label="annoAttivazione" required>
                      <mat-error *ngIf="configForm.get('annoAttivazione')?.invalid && (configForm.get('annoAttivazione')?.touched || submitted)">
                        Campo obbligatorio
                      </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="field-group">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Ragione Sociale</mat-label>
                      <mat-select formControlName="ragSociale">
                        <mat-option *ngFor="let cer of cers" [value]="cer.ragSociale">
                          {{ cer.ragSociale }}
                        </mat-option>
                      </mat-select>
                      <mat-error *ngIf="configForm.get('ragSociale')?.invalid && (configForm.get('ragSociale')?.touched || submitted)">
                        Selezione obbligatoria
                      </mat-error>
                </mat-form-field>
              </div>
            </div>
          </mat-card>
        </div>
      </div>
      <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px">
        <button mat-raised-button color="primary" type="submit" style="border-radius: 8px; min-width: 130px; height: 42px; display: flex; align-items: center; gap: 6px;">
          <mat-icon>edit</mat-icon>Aggiungi
        </button>
        <button mat-raised-button routerLink="/configurazione" style="border-radius: 8px; min-width: 130px; height: 42px;">
          Indietro
        </button>
      </div>
</form>

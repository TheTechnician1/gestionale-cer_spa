<h3>Profilo Utente</h3>
<br>
<div class="profile-container">
  <div *ngIf="utente" class="profile-header">
    <div class="user-info">
      <h4 class="title"> Benvenuto!  {{ utente.nomeUtente }} {{ utente.cognomeUtente }}</h4>
        <br>
        <p>
            <span class="label">Nome:    </span>
            <span class="value">{{ utente.nomeUtente }}</span>
        </p>
        <p>
            <span class="label">Cognome:    </span>
            <span class="value">{{ utente.cognomeUtente }}</span>
        </p>
        <p>
            <span class="label">Codice fiscale:    </span>
            <span class="value">{{ utente.codiceFiscale }}</span>
        </p>
        <p>
            <span class="label">e-mail:    </span>
            <span class="value">{{ utente.mail }}</span>
        </p>
        <p>
            <span class="label">Numero di telefono:    </span>
            <span class="value">{{ utente.numeroTelefono }}</span>
        </p>
        <p>
            <span class="label">Ruolo:    </span>
            <span class="value">{{ utente.ruolo }}</span>
        </p>
    </div>
  </div>

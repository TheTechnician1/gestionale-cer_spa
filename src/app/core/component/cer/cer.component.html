<div>
  <h3 class="demo-section">
    <span [matBadge]="cer.length" matBadgeOverlap="true" style="padding-right: 10px;">Gestione Comunità Energetiche</span>
  </h3>
  <div class="filtro" rows="3">
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Ragione Sociale</mat-label>
      <input [(ngModel)]="filtro.ragioneSociale" matInput type="text" aria-label="ragioneSociale">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Codice Fiscale</mat-label>
      <input [(ngModel)]="filtro.codiceFiscale" matInput type="text" aria-label="codiceFiscale">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Comune Legale</mat-label>
      <input [(ngModel)]="filtro.comuneLegale" matInput type="text" aria-label="comuneLegale">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Provincia Legale</mat-label>
      <input [(ngModel)]="filtro.provinciaLegale" matInput type="text" aria-label="provinciaLegale">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Regione Legale</mat-label>
      <input [(ngModel)]="filtro.regioneLegale" matInput type="text" aria-label="regioneLegale">
    </mat-form-field>
    <div class="button-filtro">
      <button mat-raised-button color="primary" type="button" value="Cerca" aria-label="Cerca" (click)="filtraCER()">
        <mat-icon>search</mat-icon> Ricerca
      </button>
      <button mat-raised-button type="button" (click)="resetFiltro()">
        <mat-icon>close</mat-icon> Reset
      </button>
    </div>
  </div>
</div>
<div class="table">
  <table mat-table [dataSource]="isFiltering ? listaFiltrata : dataSource" matSort (matSortChange)="sortData($event)" class="mat-elevation-z8">
    <ng-container matColumnDef="id_cer">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="id_cer" sortActionDescription="Sort by number"> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id_cer}} </td>
    </ng-container>
    <ng-container matColumnDef="ragione_sociale">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="ragione_sociale"> Ragione Sociale </th>
      <td mat-cell *matCellDef="let element"> {{element.ragione_sociale}} </td>
    </ng-container>
    <ng-container matColumnDef="partita_iva">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="partita_iva"> P.IVA </th>
      <td mat-cell *matCellDef="let element"> {{element.partita_iva}} </td>
    </ng-container>
    <ng-container matColumnDef="forma_giuridica">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="forma_giuridica"> Forma Giuridica </th>
      <td mat-cell *matCellDef="let element"> {{element.forma_giuridica}} </td>
    </ng-container>
    <ng-container matColumnDef="azioni">
      <th mat-header-cell *matHeaderCellDef> Azioni </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button routerLink="dettaglio-cer/:id">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-button routerLink="modifica-cer/:id">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="tableCER"></tr>
    <tr mat-row *matRowDef="let row; columns: tableCER;"></tr>
  </table>
  <mat-paginator class="b-shadow" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements"></mat-paginator>
</div>
<div>
  <button mat-raised-button color="primary" routerLink="inserimento-cer">
    <mat-icon>add</mat-icon>
    Aggiungi una nuova CER
  </button>
</div>
<router-outlet></router-outlet>

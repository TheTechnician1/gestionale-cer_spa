<div class="datiEnerg">
  <div class="h3-header">
   <h3>Dati energetici</h3>
    <div>
     <button mat-raised-button routerLink="/dati-energetici/inserimento-dati-energetici" color="primary" ><mat-icon>add</mat-icon> Aggiungi Dati</button>
    </div>
  </div>
</div>
<div>
  <div class="filtro" rows="3">
    <h6>Filtra per:</h6>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Energia Prodotta</mat-label>
      <input [(ngModel)]="filtro.energia_prodotta" matInput type="text" aria-label="energia_prodotta">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Energia Prelevata</mat-label>
      <input [(ngModel)]="filtro.energia_prelevata" matInput type="text" aria-label="energia_prelevata">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Energia Immessa</mat-label>
      <input [(ngModel)]="filtro.energia_immessa" matInput type="text" aria-label="energia_immessa">
    </mat-form-field>
    <div class="button-filtro">
      <button mat-raised-button color="primary" type="button" value="Cerca" aria-label="Cerca" (click)="filtraDatiEnergetici()">
        <mat-icon>search</mat-icon> Ricerca
      </button>
      <button mat-raised-button type="button" (click)="resetFiltro()">
        <mat-icon>close</mat-icon> Reset
      </button>
    </div>
  </div>
</div>
<div class="table">
  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortData($event)" class="mat-elevation-z8">
    <ng-container matColumnDef="id_dati">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="id_dati"> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id_dati}} </td>
    </ng-container>
    <ng-container matColumnDef="energia_prodotta">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="energia_prodotta"> Energia Prodotta </th>
      <td mat-cell *matCellDef="let element"> {{element.energia_prodotta}} </td>
    </ng-container>
    <ng-container matColumnDef="energia_prelevata">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="energia_prelevata">Energia Prelevata</th>
      <td mat-cell *matCellDef="let element"> {{element.energia_prelevata}} </td>
    </ng-container>
    <ng-container matColumnDef="azioni">
      <th mat-header-cell *matHeaderCellDef> Azioni </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button routerLink="dettaglio-dati/:id">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-button routerLink="modifica-dati/:id">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="tableDat"></tr>
    <tr mat-row *matRowDef="let row; columns: tableDat;"></tr>
  </table>
  <mat-paginator class="mat-elevation-z8" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements"></mat-paginator>
</div>
<router-outlet></router-outlet>

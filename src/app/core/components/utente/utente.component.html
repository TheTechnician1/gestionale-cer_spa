<div class="profile-wrapper">
  <div class="profile-card mat-elevation-z3" *ngIf="utente">
    <h2 class="welcome">
      Benvenuto <span>{{ utente.name }} {{ utente.surname }}</span>!
    </h2>
    <div class="info-row">
      <span class="label">Nome:</span>
      <span class="value">{{ utente.name }}</span>
    </div>
    <div class="info-row">
      <span class="label">Cognome:</span>
      <span class="value">{{ utente.surname }}</span>
    </div>
    <div class="info-row">
      <span class="label">E-mail:</span>
      <span class="value">{{ utente.email }}</span>
    </div>
    <div class="info-row password-row">
      <span class="label">Password:</span>
      <span class="value">{{ showPassword ? utente.password : '••••••••' }}</span>
      <button mat-button (click)="togglePassword()">
        {{ showPassword ? 'Nascondi' : 'Mostra' }}
      </button>
    </div>
    <div class="info-row">
      <span class="label">Saldo attuale:</span>
      <span class="value saldo">{{ utente.balance | number:'1.2-2' }} €</span>
    </div>
    <div class="add-balance-box">
      <mat-form-field appearance="outline" class="add-field">
        <mat-label>Aggiungi saldo</mat-label>
        <input matInput type="number" min="0" [formControl]="addControl" />
        <mat-error *ngIf="addControl.hasError('min')">Non puoi inserire numeri negativi</mat-error>
      </mat-form-field>
      <button mat-raised-button (click)="addBalance()" [disabled]="addControl.invalid || addControl.value === 0">
        Aggiungi
      </button>
    </div>
    <button mat-raised-button class="edit-profile-btt" [routerLink]="['/modifica-profilo', utente?.id]">
      Modifica Profilo
    </button>
  </div>
</div>

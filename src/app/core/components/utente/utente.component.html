<h3>Profilo Utente</h3>
<br />
<div class="profile-container">
  <div *ngIf="utente" class="profile-header">
    <div class="user-info">
      <h4 class="title">Benvenuto! {{ utente.nome }} {{ utente.cognome }}</h4>
      <br />
      <p>
        <span class="label">Nome: </span>
        <span class="value">{{ utente.nome }}</span>
      </p>
      <p>
        <span class="label">Cognome: </span>
        <span class="value">{{ utente.cognome }}</span>
      </p>
      <p>
        <span class="label">e-mail: </span>
        <span class="value">{{ utente.email }}</span>
      </p>
      <p>
        <span class="label">saldo: </span>
        <span class="value">{{ utente.saldo }}</span>
      </p>


      <button (click)="update = true">
        Aggiorna il mio saldo
      </button>


      <mat-form-field *ngIf="update === true" appearance="outline">
        <mat-label>Inserisci il saldo da aggiungere</mat-label>
        <input matInput placeholder="Quanto vuoi aggiungere?">
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="onSubmit()">Registrati</button>

    </div>
  </div>
</div>

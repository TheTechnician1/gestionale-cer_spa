<main>
  <section class="hero mat-elevation-z4">
    <div class="hero-text">
      <h2>Offerte di oggi</h2>
      <p>Scopri le migliori offerte selezionate per te.</p>
      <a mat-button color="primary" routerLink="/offerte">Vai alle offerte</a>
    </div>
  </section>
  <section class="products-grid">
    <ng-container *ngFor="let p of pagedProducts">
      <mat-card class="product-card">
        <div class="image-wrapper">
          <img mat-card-image [src]="p.immagine" alt="p.nomeProdotto" (click)="details(p.id!)">
        </div>
        <mat-card-content>
          <h3 class="product-title">{{ p.nomeProdotto }}</h3>
          <p class="quantity">Disponibilità: {{ getAvailable(p) }}</p>
          <p class="product-price">{{ p.prezzo }} €</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button class="add-cart" (click)="addToCart(p)">
            <mat-icon>add_shopping_cart</mat-icon>
            Aggiungi al carrello
          </button>
        </mat-card-actions>
      </mat-card>
    </ng-container>
  </section>
  <mat-paginator [length]="totalProducts" [pageSize]="pageSize" [pageSizeOptions]="[8, 16, 24]" (page)="onPageChange($event)"></mat-paginator>
</main>

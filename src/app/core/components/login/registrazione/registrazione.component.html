<div class="register-page">
  <mat-card class="register-card">
    <h4>Crea il tuo account</h4>
    <br>
    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Cognome</mat-label>
        <input matInput formControlName="cognome">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" [type]="hide ? 'password' : 'text'">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Conferma Password</mat-label>
        <input matInput formControlName="confermaPassword" [type]="hide ? 'password' : 'text'">
      </mat-form-field>
      <button mat-raised-button color="primary" class="register-btn" (click)="onSubmit()">
        Registrati
      </button>
    </form>
  </mat-card>
</div>

<div style="display: flex; justify-content: center; align-items: center; height: 80vh">
  <img src="../../../../../assets/img/515ec58123932b0c333abce41f9f000b.png" alt="Login Illustration" style="width: 100%; max-width: 400px; margin-top: 20px; margin-right: 20px;" />
  <mat-card style="width: 400px; padding: 20px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px">
      <mat-icon _ngcontent-lfm-c21="" role="img" class="mat-icon notranslate material-icons mat-ligature-font mat-icon-no-color" aria-hidden="true" data-mat-icon-type="font">account_circle</mat-icon>
      <h2 style="margin: 0">Login</h2>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" aria-label="email" required />
        <mat-error appFormControlError [control]="loginForm.get('email')" label="Email" [customMessages]="emailErrorMessages"></mat-error>
      </mat-form-field>
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Password</mat-label>
        <input matInput [type]="hide ? 'text' : 'password'" formControlName="password" aria-label="password" required />
        <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
          <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
        <mat-error appFormControlError [control]="loginForm.get('password')" label="Password" [customMessages]="passwordErrorMessages"></mat-error>
      </mat-form-field>
      <div class="error" *ngIf="loginError">Email o password errati</div>
      <mat-checkbox class="remember-me" formControlName="rememberMe" style="display: block; margin-bottom: 8px;">
        Ricordami
      </mat-checkbox>
      <span style="font-size: 12px; color: grey; display: block;">Hai dimenticato la password? <a routerLink="/reset-password" style="color: #3f51b5; text-decoration: none;">Recupera qui</a></span>
      <div style="display: flex; justify-content: center; margin-top: 10px;">
        <button mat-raised-button color="primary" type="submit" style="width: 100%;">Accedi</button>
      </div>
      <span style="font-size: 12px; color: grey; display: block; text-align: center; margin-top: 15px;">Non hai un account? <a routerLink="/registrazione" style="color: #3f51b5; text-decoration: none;">Registrati qui</a></span>
    </form>
  </mat-card>
</div>

<main class="search-layout">
  <aside class="filters">
    <mat-card class="filters-card">
      <h2>Filtri</h2>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Categoria</mat-label>
        <mat-select [(ngModel)]="categoria">
          <mat-option value="">Tutte</mat-option>
          <mat-option *ngFor="let c of categorie" [value]="c">
            {{ c }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Prezzo minimo</mat-label>
        <input matInput type="number" min="0" [(ngModel)]="minPrice" (input)="normalizeFilters()">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Prezzo massimo</mat-label>
        <input matInput type="number" min="1" [(ngModel)]="maxPrice" (input)="normalizeFilters()">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Quantità minima</mat-label>
        <input matInput type="number" min="1" [(ngModel)]="minQuantity" (input)="normalizeFilters()">
      </mat-form-field>
      <button mat-raised-button color="primary" class="full add-cart" (click)="applyFilters()">
        Applica filtri
      </button>
      <button mat-button color="warn" class="full" (click)="resetFilters()">
        Reset
      </button>
    </mat-card>
  </aside>
  <section class="results">
    <h1>Risultati:</h1>
    <div class="results-grid">
      <ng-container *ngFor="let p of visibleProducts">
        <mat-card class="product-card">
          <img mat-card-image (click)="details(p.id!)" [src]="p.immagine" alt="{{ p.nomeProdotto }}">
          <mat-card-content>
            <h3>{{ p.nomeProdotto }}</h3>
            <p class="quantity">Disponibilità: {{ getAvailable(p) }}</p>
            <p class="price">{{ p.prezzo }} €</p>
            <p class="category">{{ p.categoria }}</p>
          </mat-card-content>
          <mat-card-actions>
          <button mat-raised-button color="primary" class="add-cart" (click)="addToCart(p)">
            <mat-icon>add_shopping_cart</mat-icon>
            Aggiungi al carrello
          </button>
        </mat-card-actions>
        </mat-card>
      </ng-container>
    </div>
  </section>
</main>

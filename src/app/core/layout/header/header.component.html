<header class="topbar">
  <div class="logo" routerLink="products">
    <span class="my">My</span><span class="store">Store</span>
  </div>
  <div class="search-box">
    <input type="text" placeholder="Cerca prodotti..." />
    <button>
      <mat-icon>search</mat-icon>
    </button>
  </div>
  <div class="actions">
    <ng-container *ngIf="user; else login">
      <div class="user">
        <mat-icon>person</mat-icon>
        {{ userName }}
      </div>
      <button routerLink="/cart">
        <mat-icon>shopping_cart</mat-icon>
        Carrello ({{ cartCount }})
      </button>
      <button (click)="logout()">
        Logout
      </button>
    </ng-container>
    <ng-template #login>
      <button routerLink="/login">
        <mat-icon>person</mat-icon>
        Accedi
      </button>
    </ng-template>
  </div>
</header>

<mat-toolbar class="app-toolbar">
  <span class="title" routerLink="/">My<span class="brand">Store</span></span>
  <div class="search-container">
    <input matInput placeholder="Cerca prodotti" [(ngModel)]="searchTerm" (keyup.enter)="search()" class="search-field" aria-label="Cerca prodotti"/>
    <button mat-icon-button matSuffix (click)="search()" aria-label="Cerca">
      <mat-icon>search</mat-icon>
    </button>
  </div>
  <button mat-button aria-label="Profilo" [matMenuTriggerFor]="menu">
    <mat-icon>account_circle</mat-icon>
    <span class="text">Accedi</span>
    <mat-menu #menu="matMenu">
      <button *ngIf="!(isLoggedIn$ | async)" mat-menu-item routerLink="login">Login</button>
      <button *ngIf="isLoggedIn$ | async" mat-menu-item routerLink="/dashboard">Home</button>
      <button *ngIf="isLoggedIn$ | async" mat-menu-item routerLink="profilo/:id">Profilo</button>
      <button *ngIf="isLoggedIn$ | async" mat-menu-item (click)="logout()" routerLink="/login">Logout</button>
    </mat-menu>
  </button>
  <button mat-button aria-label="carrello" routerLink="/carrello">
    <mat-icon>shopping_cart</mat-icon>
    <span class="text">Carrello</span>
  </button>
</mat-toolbar>

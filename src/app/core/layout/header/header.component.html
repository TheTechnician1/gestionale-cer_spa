<mat-toolbar class="app-toolbar">

  <div class="left">
    <span class="title">My Store</span>
  </div>

  <div class="center">
    <div class="search-bar" *ngIf="isProdottiPage$ | async">
      <mat-icon class="search-icon">search</mat-icon>
      <input
        type="text"
        placeholder="Cerca prodotti..."
        [(ngModel)]="searchText"
        (keyup.enter)="onSearchChange()"
      />
    </div>
  </div>

  <div class="right">
    <button mat-icon-button *ngIf="isLoggedIn$ | async" routerLink="/carrello/{{ idUtente }}">
      <mat-icon>shopping_cart</mat-icon>
    </button>
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>

</mat-toolbar>

<mat-menu #menu="matMenu">
  <button *ngIf="!(isLoggedIn$ | async)" mat-menu-item routerLink="login">Login</button>
  <button *ngIf="isLoggedIn$ | async" mat-menu-item (click)="toHome()">Home</button>
  <button *ngIf="isLoggedIn$ | async" mat-menu-item routerLink="/profilo/:id">Profilo</button>
  <button *ngIf="isLoggedIn$ | async" mat-menu-item (click)="logout()" routerLink="/login">Logout</button>
</mat-menu>

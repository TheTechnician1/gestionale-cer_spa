<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="toggleSidebar.emit()" aria-label="Apri/chiudi menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">CER Gestionale</span>

  <span class="spacer"></span>

  <button
    mat-icon-button
    aria-label="Notifiche"
    [matMenuTriggerFor]="notificheMenu"
    *ngIf="mostraNotifiche()"
    (click)="segnaNotificheLette()"
    class="notification-button"
  >
    <mat-icon>notifications</mat-icon>
    <span class="notification-badge" *ngIf="notificheService.totaleNonLette > 0">
      {{ notificheService.totaleNonLette }}
    </span>
  </button>

  <mat-menu #notificheMenu="matMenu" class="notification-menu">
    <ng-container *ngIf="notifiche$ | async as notifiche">
      <div class="notification-panel" (click)="$event.stopPropagation()">
        <div class="notification-panel-header">
          <span>Notifiche</span>
          <button
            mat-button
            type="button"
            (click)="svuotaNotifiche()"
            *ngIf="notifiche.length > 0"
          >
            Svuota
          </button>
        </div>

        <div class="notification-empty" *ngIf="notifiche.length === 0">
          Nessuna notifica.
        </div>

        <div class="notification-item" *ngFor="let notifica of notifiche">
          <strong>{{ notifica.titolo }}</strong>
          <span>{{ notifica.messaggio }}</span>
        </div>
      </div>
    </ng-container>
  </mat-menu>

  <button mat-icon-button aria-label="Profilo" [matMenuTriggerFor]="menu" #menuTrigger>
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    
    <button mat-menu-item (click)="navigateTo()">
      <mat-icon>exit_to_app</mat-icon>
      <span>User Profile</span>
    </button>

    <button mat-menu-item (click)="openDialog()">
      <mat-icon>exit_to_app</mat-icon>
      <span>Log Out</span>
    </button>

  </mat-menu>


</mat-toolbar>

<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="toggleSidebar.emit()" aria-label="Apri/chiudi menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">CER Gestionale</span>

  <span class="spacer"></span>

  <button mat-icon-button aria-label="Notifiche">
    <mat-icon>notifications</mat-icon>
  </button>
  <button mat-icon-button aria-label="Profilo" [matMenuTriggerFor]="menu">
    <mat-icon>account_circle</mat-icon>
    <mat-menu #menu="matMenu">
      <button *ngIf="isLog" mat-menu-item routerLink="login">Login</button>
      <button *ngIf="!isLog" mat-menu-item>Home</button>
      <button *ngIf="!isLog" mat-menu-item>Logout</button>
    </mat-menu>
  </button>
</mat-toolbar>

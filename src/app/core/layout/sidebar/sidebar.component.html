<nav class="sidebar">
  <div class="sidebar-title">Sezioni</div>

  <mat-tree class="sidebar-tree" *ngIf="dataSource$ | async as dataSource" [dataSource]="dataSource" [treeControl]="treeControl">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
      <button mat-icon-button class="toggle-placeholder" disabled></button>
      <mat-icon class="node-icon">{{ node.icon }}</mat-icon>
      <a class="node-link" [routerLink]="node.route">{{ node.label }}</a>
    </mat-tree-node>

    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
      <div class="node-row" matTreeNodePadding>
        <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.label">
          <mat-icon>
            {{ treeControl.isExpanded(node) ? "expand_more" : "chevron_right" }}
          </mat-icon>
        </button>
        <mat-icon class="node-icon">{{ node.icon }}</mat-icon>
        <span class="node-label">{{ node.label }}</span>
      </div>
      <div class="tree-inset" *ngIf="treeControl.isExpanded(node)">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>
  </mat-tree>
</nav>

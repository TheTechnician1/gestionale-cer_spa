<div
  *ngIf="isLoading"
  style="display: flex; justify-content: center; padding: 40px"
>
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div
  *ngIf="!isLoading"
  class="mat-elevation-z4"
  style="margin: 24px; padding: 24px; background: #fdfdfd; border-radius: 8px"
>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <h2
      style="
        margin-top: 0;
        margin-bottom: 24px;
        font-weight: 600;
        color: #1e293b;
      "
    >
      Modifica Anagrafica CER (ID: {{ idCer }})
    </h2>

    <div
      style="
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      "
    >
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Ragione Sociale</mat-label>
        <input formControlName="ragSociale" matInput type="text" />
        <mat-error *ngIf="editForm.get('ragSociale')?.hasError('required')"
          >Campo obbligatorio</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Forma Giuridica</mat-label>
        <input formControlName="formaGiuridica" matInput type="text" />
        <mat-error *ngIf="editForm.get('formaGiuridica')?.hasError('required')"
          >Campo obbligatorio</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Codice Fiscale</mat-label>
        <input
          formControlName="codFisc"
          matInput
          type="text"
          style="text-transform: uppercase"
        />
        <mat-error *ngIf="editForm.get('codFisc')?.hasError('required')"
          >Campo obbligatorio</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Partita IVA</mat-label>
        <input formControlName="pIva" matInput type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Comune</mat-label>
        <input formControlName="comune" matInput type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Provincia</mat-label>
        <input
          formControlName="provincia"
          matInput
          type="text"
          maxLength="2"
          style="text-transform: uppercase"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Regione</mat-label>
        <input formControlName="regione" matInput type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Referente Principale</mat-label>
        <input formControlName="referente" matInput type="text" />
      </mat-form-field>
    </div>

    <div
      style="
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        border-top: 1px solid #e2e8f0;
        padding-top: 20px;
      "
    >
      <button
        mat-button
        type="button"
        [disabled]="isSaving"
        (click)="cancel()"
        style="height: 44px; padding: 0 24px"
      >
        Annulla
      </button>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="editForm.invalid || isSaving"
        style="
          height: 44px;
          padding: 0 24px;
          border-radius: 6px;
          font-weight: 600;
        "
      >
        Salva Modifiche
      </button>
    </div>
  </form>
</div>

<div class="toast-wrapper" *ngIf="toast$ | async as toast">
  <div
    class="toast-message"
    [class.successo]="toast.tipo === 'successo'"
    [class.errore]="toast.tipo === 'errore'"
    [class.info]="toast.tipo === 'info'"
  >
    <div class="toast-icon" aria-hidden="true">
      <span *ngIf="toast.tipo === 'successo'">OK</span>
      <span *ngIf="toast.tipo === 'errore'">!</span>
      <span *ngIf="toast.tipo === 'info'">i</span>
    </div>

    <div class="toast-content">
      <strong>{{ toastService.recuperaTitoloToast(toast) }}</strong>
      <span>{{ toast.testo }}</span>
    </div>

    <button type="button" aria-label="Chiudi notifica" (click)="chiudiToast()">
      x
    </button>
  </div>
</div>

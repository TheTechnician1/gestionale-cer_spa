<div class="auth-wrapper">
  <div class="auth-header">
    <img src="assets/images/logoShop.png" alt="ShopiDu" class="logo" />
  </div>

  <mat-card class="auth-card">
    <mat-card-title>Registrati con pochi click!</mat-card-title>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" placeholder="Inserisci nome" />
          <mat-error *ngIf="registerForm.get('nome')?.invalid">
            Nome obbligatorio
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Cognome</mat-label>
          <input matInput formControlName="cognome" placeholder="Inserisci cognome" />
          <mat-error *ngIf="registerForm.get('cognome')?.invalid">
            Cognome obbligatorio
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Inserisci email" />
          <mat-error *ngIf="registerForm.get('email')?.invalid">
            Email non valida
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Inserisci password" />
          <mat-error *ngIf="registerForm.get('password')?.invalid">
            Password non valida (min 6 caratteri, almeno una maiuscola e un numero)
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid" class="full-width">
          Registrati
        </button>

        <p class="login-link">Hai già un account? <a routerLink="/login">Accedi</a></p>

      </form>
    </mat-card-content>
  </mat-card>
</div>

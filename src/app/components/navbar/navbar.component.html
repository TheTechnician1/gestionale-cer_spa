<header class="shop-navbar">
  <div class="navbar-left">
    <a routerLink="/home" class="brand">
      <img src="assets/immages/Logo.png" alt="Majorbit Group" />
    </a>
    <nav class="main-nav">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/prodotti" routerLinkActive="active">Prodotti</a>
      <a routerLink="/home" fragment="categorie">Categorie</a>
    </nav>
  </div>

  <div class="navbar-center">
    <form class="search-box" (submit)="cercaProdotti($event)">
      <input
        type="text"
        [value]="testoRicerca"
        (input)="aggiornaTestoRicerca($event)"
        placeholder="Cerca prodotti..."
        aria-label="Cerca prodotti"
      />
      <button type="submit" class="icon-button" aria-label="Cerca prodotti">⌕</button>
    </form>
  </div>

  <div class="navbar-right">
    <button
      type="button"
      class="icon-button"
      routerLink="/home"
      fragment="preferiti"
      title="preferiti"
      aria-label="Vai ai preferiti"
    >
      &hearts;
    </button>

    <button
      type="button"
      class="icon-button"
      routerLink="/carrello"
      title="carrello"
      aria-label="Vai al carrello"
    >
      <svg class="cart-svg" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6h15l-2 8H8L6 3H3"/><circle cx="9" cy="20" r="1.7"/><circle cx="18" cy="20" r="1.7"/></svg>
    </button>

    <div class="account-menu">
      <button
        type="button"
        class="user-button"
        (click)="cambiaStatoMenuAccount()"
        aria-label="Apri menu account"
      >
        Account
        <span>&#9662;</span>
      </button>

      <div class="account-dropdown" *ngIf="menuAccountAperto">
        <div class="account-dropdown-header">
          <span>Area personale</span>
          <strong>Il tuo account</strong>
        </div>

        <a routerLink="/profilo" (click)="chiudiMenuAccount()">
          <span class="menu-icon">P</span>
          <span>
            <strong>Profilo</strong>
            <small>Dati e saldo</small>
          </span>
        </a>

        <a routerLink="/fondi" (click)="chiudiMenuAccount()">
          <span class="menu-icon">EUR</span>
          <span>
            <strong>Fondi</strong>
            <small>Ricarica saldo</small>
          </span>
        </a>

        <button type="button" class="logout-button" (click)="logout()">
          <span class="menu-icon logout-icon">OUT</span>
          <span>
            <strong>Logout</strong>
            <small>Cambia utente</small>
          </span>
        </button>
      </div>
    </div>
  </div>
</header>

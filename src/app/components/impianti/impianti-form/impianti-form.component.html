<h2>Inserimento nuovo impianto</h2>

<div class="white-box">
  <form [formGroup]="formImpianto" (ngSubmit)="salvataggio()">

    <div class="form-group">
      <label for="idConfigurazione">Configurazione</label>
      <input
        type="number"
        id="idConfigurazione"
        formControlName="idConfigurazione">
    </div>

    <div class="form-group">
      <label for="flagEsercizio">Flag Esercizio</label>
      <input
        type="text"
        id="flagEsercizio"
        formControlName="flagEsercizio">
    </div>

    <div class="form-group">
      <label for="dataEntrataEsercizio">Data Entrata Esercizio</label>
      <input
        type="date"
        id="dataEntrataEsercizio"
        formControlName="dataEntrataEsercizio">
    </div>

    <div class="form-group">
      <label for="tipologiaImpianto">Tipologia Impianto</label>
      <input
        type="text"
        id="tipologiaImpianto"
        formControlName="tipologiaImpianto">
    </div>

    <div class="form-group">
      <label for="potenzaNominaleKw">Potenza Nominale (kW)</label>
      <input
        type="number"
        id="potenzaNominaleKw"
        formControlName="potenzaNominaleKw">
    </div>

    <div class="form-group">
      <label for="presenzaAccumulo">Presenza Accumulo</label>
      <input
        type="text"
        id="presenzaAccumulo"
        formControlName="presenzaAccumulo">
    </div>

    <div class="form-group">
      <label for="capacitaAccumuloKwh">Capacità Accumulo (kWh)</label>
      <input
        type="number"
        id="capacitaAccumuloKwh"
        formControlName="capacitaAccumuloKwh">
    </div>

    <div class="form-group">
      <label for="categoriaProduttore">Categoria Produttore</label>
      <input
        type="text"
        id="categoriaProduttore"
        formControlName="categoriaProduttore">
    </div>

    <div class="form-group">
      <label for="codiceCategoriaProduttore">Codice Categoria Produttore</label>
      <input
        type="text"
        id="codiceCategoriaProduttore"
        formControlName="codiceCategoriaProduttore">
    </div>

    <div class="form-group">
      <label for="regione">Regione</label>
      <select formControlName="regione">
          <option [ngValue]="null">
              -- Seleziona Regione --
          </option>
          <option *ngFor="let r of regioni$ | async"
              [ngValue]="r">
                  {{r.descrizione}}
          </option>
      </select>
    </div>

    <div class="form-group">
      <label for="provincia">Provincia</label>
      <select formControlName="provincia">
          <option [ngValue]="null">
              -- Seleziona Provincia --
          </option>
          <option *ngFor="let p of provincie$ | async"
              [ngValue]="p">
                  {{p.descrizione}}
          </option>
      </select>
    </div>

      <div class="form-group">
      <label for="comune">Comune</label>
      <select formControlName="comune">
          <option [ngValue]="null">
              -- Seleziona Comune --
          </option>
          <option *ngFor="let c of comuni$ | async"
              [ngValue]="c">
                  {{c.descrizione}}
          </option>
      </select>
    </div>

    <div class="form-group">
      <label for="indirizzo">Indirizzo</label>
      <input
        type="text"
        id="indirizzo"
        formControlName="indirizzo">
    </div>

    <div class="form-group">
      <label for="civico">Civico</label>
      <input
        type="text"
        id="civico"
        formControlName="civico">
    </div>

    <div class="form-group">
      <label for="cap">CAP</label>
      <input
        type="text"
        id="cap"
        formControlName="cap">
    </div>

    <div class="form-group">
      <label for="statoImpianto">Stato Impianto</label>
      <input
        type="text"
        id="statoImpianto"
        formControlName="statoImpianto">
    </div>

    <div class="form-group">
      <label for="attivo">Attivo</label>
      <input
        type="text"
        id="attivo"
        formControlName="attivo">
    </div>

    <div class="form-group">
      <label for="emailUtenteLoggato">Email Utente</label>
      <input
        type="email"
        id="emailUtenteLoggato"
        formControlName="emailUtenteLoggato">
    </div>

    <button type="submit"       class="search-btn">
      Salva
    </button>
  </form>
</div>

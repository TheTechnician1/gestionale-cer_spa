<div class="auth-wrapper">
  <div class="auth-header">
    <img src="assets/images/logoShop.png" alt="ShopiDu" class="logo" />
  </div>

  <mat-card class="auth-card">
    <mat-card-title>Accedi</mat-card-title>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Inserisci email" />
          <mat-error *ngIf="loginForm.get('email')?.invalid">
            Email non valida
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Inserisci password" />
          <mat-error *ngIf="loginForm.get('password')?.invalid">
            Password non valida (min 6 caratteri, almeno una maiuscola e un numero)
          </mat-error>
        </mat-form-field>

        <div class="ricordami">
          <mat-checkbox formControlName="ricordami">Ricorda il mio account</mat-checkbox>
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="full-width">
          Accedi
        </button>

        <p class="register-link">Non hai un account? <a routerLink="/register">Registrati</a></p>

      </form>
    </mat-card-content>
  </mat-card>
</div>

<mat-card class="edit-card">

  <div class="header">
    <h2>
      {{ isEdit ? 'Modifica dato energetico' : 'Nuovo dato energetico' }}
    </h2>
    <p>Compila i campi per salvare i dati energetici</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form">

    <div class="grid-2">

      <mat-form-field appearance="outline">
        <mat-label>CER</mat-label>
        <input matInput formControlName="idCer">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Anno</mat-label>
        <input matInput formControlName="annoRiferimento">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Energia prodotta</mat-label>
        <input matInput type="number" formControlName="energiaProdottaMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Energia prelevata</mat-label>
        <input matInput type="number" formControlName="energiaPrelevataMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Energia immessa</mat-label>
        <input matInput type="number" formControlName="energiaImmessaMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Energia condivisa</mat-label>
        <input matInput type="number" formControlName="energiaCondivisaMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Autoconsumo</mat-label>
        <input matInput type="number" formControlName="energiaAutoconsumataMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Configurazione</mat-label>
        <input matInput type="number" formControlName="idConfigurazione">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tariffa premio</mat-label>
        <input matInput type="number" formControlName="tariffaPremioEuro">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Corrispettivo premio</mat-label>
        <input matInput type="number" formControlName="corrispettivoPremioEuro">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>CO₂ evitata</mat-label>
        <textarea matInput rows="2" formControlName="riduzioneCo2Ton"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email utente</mat-label>
        <input matInput formControlName="emailUtenteLoggato">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Note</mat-label>
        <textarea matInput rows="3" formControlName="note"></textarea>
      </mat-form-field>

    </div>

    <!-- ACTIONS -->
    <div class="actions">

      <button mat-button type="button" (click)="back()">
        Annulla
      </button>

      <button mat-raised-button color="primary" type="submit">
        {{ isEdit ? 'Aggiorna' : 'Salva' }}
      </button>

    </div>

  </form>

</mat-card>

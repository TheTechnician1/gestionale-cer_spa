<mat-card class="edit-card" *ngIf="formData">

  <div class="header">
    <h2>Modifica Dati Energetici</h2>
    <p>Aggiorna i dati della scheda</p>
  </div>

  <div class="grid-3">

    <mat-form-field appearance="outline">
      <mat-label>Anno</mat-label>
      <input matInput type="number" [(ngModel)]="formData.anno">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Id CER</mat-label>
      <input matInput type="number" [(ngModel)]="formData.idCer">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Partita IVA</mat-label>
      <input matInput [(ngModel)]="formData.partitaIva">
    </mat-form-field>

  </div>

  <div class="grid-3">

    <mat-form-field appearance="outline">
      <mat-label>Id Configurazione</mat-label>
      <input matInput type="number" [(ngModel)]="formData.idConfig">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Codice Cabina</mat-label>
      <input matInput [(ngModel)]="formData.codiceCabina">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Stato Scheda</mat-label>
      <input matInput [(ngModel)]="formData.statoScheda">
    </mat-form-field>

  </div>

  <div class="grid-2">

    <mat-form-field appearance="outline">
      <mat-label>Inizio Anno</mat-label>
      <input matInput [(ngModel)]="formData.inizioAnno">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fine Anno</mat-label>
      <input matInput [(ngModel)]="formData.fineAnno">
    </mat-form-field>

  </div>

  <div class="actions">
    <button mat-raised-button color="primary" (click)="salvaModifica()">
      Salva modifiche
    </button>
  </div>

</mat-card>

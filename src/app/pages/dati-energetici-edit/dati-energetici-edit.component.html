<mat-card class="edit-card" *ngIf="form">

  <!-- HEADER (TORNATO) -->
  <div class="header">
    <h2>Modifica Dati Energetici</h2>
    <p>Aggiorna i dati della scheda energetica</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="salvaModifica()" class="form">

    <!-- GRID 2 COLONNE -->
    <div class="grid-3">

      <mat-form-field appearance="outline">
        <mat-label>Anno</mat-label>
        <input matInput formControlName="annoRiferimento">
      </mat-form-field>

      <!-- CER -->
      <mat-form-field appearance="outline">

        <mat-label>CER</mat-label>

        <mat-select formControlName="idCer">

          <mat-option [value]="null">
            Tutti
          </mat-option>

   <mat-option
            *ngFor="let cer of (cerList$ | async) ?? []"
            [value]="cer.idCer">

            {{ cer.ragSociale }}

          </mat-option>

        </mat-select>

      </mat-form-field>
</div>

      <div class="grid-2">
      <mat-form-field appearance="outline">
        <mat-label>Scheda energetica</mat-label>
        <input matInput formControlName="idSchedaEnergetica">
      </mat-form-field>

     <mat-form-field appearance="outline">

        <mat-label>Cabina</mat-label>

        <mat-select formControlName="idCabina">

          <mat-option [value]="null">
            Tutte
          </mat-option>

          <mat-option
            *ngFor="let cabina of (configurazioniList$ | async) ?? []"
            [value]="cabina.idConfig">

            {{ cabina.codiceCabina }}

          </mat-option>

        </mat-select>

      </mat-form-field>


    </div>

    <div class="grid-1">
      <mat-form-field appearance="outline">
        <mat-label>Energia prodotta</mat-label>
        <input matInput formControlName="energiaProdottaMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Energia prelevata</mat-label>
        <input matInput formControlName="energiaPrelevataMhw">
      </mat-form-field>

      </div>

      <div class="grid">
      <mat-form-field appearance="outline">
        <mat-label>Energia immessa</mat-label>
        <input matInput formControlName="energiaImmessaMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Energia condivisa</mat-label>
        <input matInput formControlName="energiaCondivisaMhw">
      </mat-form-field>

      </div>

      <div class="grid">
      <mat-form-field appearance="outline">
        <mat-label>Autoconsumata</mat-label>
        <input matInput formControlName="energiaAutoconsumataMhw">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>CO₂ evitata</mat-label>
        <input matInput formControlName="riduzioneCo2Ton">
      </mat-form-field>

    </div>

    <!-- NOTE FULL WIDTH -->
    <mat-form-field appearance="outline" class="full">
      <mat-label>Note</mat-label>
      <textarea matInput formControlName="note"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Email utente</mat-label>
      <input matInput formControlName="emailUtenteLoggato">
    </mat-form-field>

    <!-- ACTIONS -->
    <div class="actions">

      <button mat-button type="button" (click)="back()">
        Annulla
      </button>

      <button mat-raised-button color="primary" type="submit">
        Salva modifiche
      </button>

    </div>

  </form>

</mat-card>

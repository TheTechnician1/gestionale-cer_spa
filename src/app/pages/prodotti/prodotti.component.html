<app-navbar></app-navbar>

<main class="prodotti-page">
  <section class="prodotti-header">
    <p>MajorBit Shop</p>
    <h1>{{ recuperaTitoloPagina() }}</h1>
  </section>

  <p class="loading-message" *ngIf="caricamento">Caricamento prodotti...</p>

  <p class="error-message" *ngIf="messaggioErrore">
    {{ messaggioErrore }}
  </p>
  <p class="success-message" *ngIf="messaggioSuccesso">
    {{ messaggioSuccesso }}
  </p>

  <section class="prodotti-grid" *ngIf="!caricamento && !messaggioErrore">
    <article class="product-card" *ngFor="let prodotto of prodotti">
      <div class="product-image">
        <a [routerLink]="['/prodotti/dettaglio', prodotto.idProdotto]">
          <img [src]="prodotto.immagine" [alt]="prodotto.nomeProdotto" />
        </a>
        <button
          type="button"
          class="heart-button"
          [class.active]="prodottoPreferito(prodotto.idProdotto)"
          [attr.aria-label]="
            prodottoPreferito(prodotto.idProdotto)
              ? 'Rimuovi dai preferiti'
              : 'Aggiungi ai preferiti'
          "
          (click)="gestisciPreferito(prodotto.idProdotto)"
        >
          &hearts;
        </button>
      </div>

      <div class="product-info">
        <p class="product-category">{{ prodotto.categoriaNome }}</p>
        <a
          class="product-title-link"
          [routerLink]="['/prodotti/dettaglio', prodotto.idProdotto]"
        >
          <h3>{{ prodotto.nomeProdotto }}</h3>
        </a>
        <p class="product-description">{{ prodotto.descrizioneBreve }}</p>

        <div class="product-footer">
          <strong>{{ prodotto.prezzo | currency: "EUR" }}</strong>
          <div class="product-actions">
            <a
              class="detail-link"
              [routerLink]="['/prodotti/dettaglio', prodotto.idProdotto]"
            >
              Dettaglio
            </a>
            <button
              type="button"
              [disabled]="prodotto.quantitaDisponibile === 0"
              (click)="aggiungiAlCarrello(prodotto.idProdotto)"
            >
              Aggiungi
            </button>
          </div>
        </div>
      </div>
    </article>
  </section>

  <p class="empty-message" *ngIf="!caricamento && prodotti.length === 0">
    Nessun prodotto trovato.
  </p>
</main>

<app-footer></app-footer>

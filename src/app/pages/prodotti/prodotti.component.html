<app-navbar></app-navbar>

<main class="prodotti-page">
  <section class="prodotti-header">
    <p>MajorBit Shop</p>
    <h1>{{ nomeCategoria ? nomeCategoria : "Tutti i prodotti" }}</h1>
  </section>

  <p class="loading-message" *ngIf="caricamento">Caricamento prodotti...</p>

  <p class="error-message" *ngIf="messaggioErrore">
    {{ messaggioErrore }}
  </p>

  <section class="prodotti-grid" *ngIf="!caricamento && !messaggioErrore">
    <article class="product-card" *ngFor="let prodotto of prodotti">
      <div class="product-image">
        <img [src]="prodotto.immagine" [alt]="prodotto.nomeProdotto" />
        <button type="button" class="heart-button">♥</button>
      </div>

      <div class="product-info">
        <p class="product-category">{{ prodotto.categoriaNome }}</p>
        <h3>{{ prodotto.nomeProdotto }}</h3>
        <p class="product-description">{{ prodotto.descrizioneBreve }}</p>

        <div class="product-footer">
          <strong>{{ prodotto.prezzo | currency: "EUR" }}</strong>
          <button type="button">Aggiungi</button>
        </div>
      </div>
    </article>
  </section>

  <p class="empty-message" *ngIf="!caricamento && prodotti.length === 0">
    Nessun prodotto trovato.
  </p>
</main>

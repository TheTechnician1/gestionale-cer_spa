    <section class="auth-page">
      <form class="panel form auth-card" (ngSubmit)="submit()">
        <p class="eyebrow">{{ lang.t('security') }}</p>
        <h1>{{ lang.t('changePassword') }}</h1>
        <label>{{ lang.t('currentPassword') }}<input required type="password" name="currentPassword" [(ngModel)]="currentPassword"></label>
        <label>{{ lang.t('newPassword') }}<input required minlength="8" type="password" name="newPassword" [(ngModel)]="newPassword"></label>
        <label>{{ lang.t('confirmNewPassword') }}<input required type="password" name="confirmPassword" [(ngModel)]="confirmPassword"></label>
        @if (message) { <p [class.error]="hasError" [class.success-text]="!hasError">{{ message }}</p> }
        <button class="button primary" type="submit">{{ lang.t('updatePassword') }}</button>
        <a class="button secondary" routerLink="/account">{{ lang.t('backToAccount') }}</a>
      </form>
    </section>

<app-navbar></app-navbar>

<main class="payment-page" *ngIf="ordine">
  <section class="payment-card">
    <p class="payment-kicker">Pagamento completato</p>
    <h1>Ordine confermato</h1>

    <div class="order-summary">
      <div>
        <span>Codice ordine</span>
        <strong>{{ ordine.codiceOrdine }}</strong>
      </div>

      <div>
        <span>Data ordine</span>
        <strong>{{ ordine.dataOrdine | date: "dd/MM/yyyy HH:mm" }}</strong>
      </div>

      <div>
        <span>Totale</span>
        <strong>{{ ordine.totaleOrdine | currency: "EUR" }}</strong>
      </div>

      <div>
        <span>Saldo residuo</span>
        <strong>{{ ordine.saldoResiduo | currency: "EUR" }}</strong>
      </div>
    </div>

    <div class="payment-actions">
      <button type="button" (click)="scaricaRicevuta()">Scarica PDF</button>

      <button
        type="button"
        class="secondary-button"
        (click)="inviaRicevutaEmail()"
      >
        Invia email
      </button>

      <a routerLink="/prodotti">Torna ai prodotti</a>
    </div>
  </section>
</main>

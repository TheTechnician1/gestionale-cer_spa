<h1 mat-dialog-title>Attenzione</h1>
<div mat-dialog-content>Sei sicuro di voler uscire? La sessione in corso potrebbe non essere stata salvata. Continuare?</div>
<div mat-dialog-actions style="text-align: right; display: block;">
    
  <button mat-button mat-dialog-close>Close</button>
  <button mat-button (click)="launchEventLogout()" cdkFocusInitial>Logout</button>
</div>

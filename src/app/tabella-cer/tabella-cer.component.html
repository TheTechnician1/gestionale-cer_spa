<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">
    <!-- Position Column -->
    <ng-container matColumnDef="ragioneSociale">
      <th mat-header-cell *matHeaderCellDef>Ragione Sociale</th>
      <td mat-cell *matCellDef="let ele">{{ ele.ragioneSociale }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="partitaIVA">
      <th mat-header-cell *matHeaderCellDef>P.IVA</th>
      <td mat-cell *matCellDef="let ele">{{ ele.partitaIVA }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="formaGiuridica">
      <th mat-header-cell *matHeaderCellDef>Forma Giuridica</th>
      <td mat-cell *matCellDef="let ele">{{ ele.formaGiuridica }}</td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="stato">
      <th mat-header-cell *matHeaderCellDef>Stato</th>
      <td mat-cell *matCellDef="let ele">{{ ele.stato }}</td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="azioni">
      <th mat-header-cell *matHeaderCellDef>Azioni</th>
      <td mat-cell *matCellDef="let ele">
        <button
          mat-icon-button
          [routerLink]="['/tabella-cer', ele.id]"
          aria-label="Visualizza dettaglio configurazione cabina energetica"
        >
          <mat-icon>visibility</mat-icon>
        </button>

        <!-- <button  mat-icon-button ><mat-icon>add_shopping_cart</mat-icon>
        </button> -->

        <button
          mat-icon-button
          *ngIf="getRuolo() === 'ADMIN' || getRuolo() === 'GEST'"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
  >
  </mat-paginator>
</div>

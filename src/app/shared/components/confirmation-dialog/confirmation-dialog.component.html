<ng-template #dialogTemplate>
  <h2 mat-dialog-title>{{ title }}</h2>

  <mat-dialog-content>
    <p *ngIf="description">{{ description }}</p>
    <ng-content select="[dialog-body]"></ng-content>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="onCancelClick()">{{ cancelText }}</button>
    <button type="button" mat-raised-button color="primary" (click)="onConfirmClick()">{{ confirmText }}</button>
  </mat-dialog-actions>
</ng-template>

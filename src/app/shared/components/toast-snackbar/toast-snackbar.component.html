<div class="toast-card" [class.success]="data.type === 'success'" [class.error]="data.type === 'error'" [class.warning]="data.type === 'warning'" [class.info]="data.type === 'info'">
  <div class="toast-header">
    <div class="toast-title-wrap">
      <mat-icon class="toast-icon" aria-hidden="true">{{ icon }}</mat-icon>
      <span class="toast-title">{{ data.title }}</span>
      <span class="toast-status" *ngIf="data.statusCode as statusCode">HTTP {{ statusCode }}</span>
    </div>
    <button type="button" mat-icon-button class="toast-close" aria-label="Chiudi notifica" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="toast-message">{{ data.message }}</div>
</div>

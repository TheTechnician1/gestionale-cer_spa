<section class="pagina-login">
  <mat-card class="scheda-login">
    <mat-card-header>
      <div mat-card-avatar class="icona-login">
        <mat-icon>account_circle</mat-icon>
      </div>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>Inserisci le credenziali per accedere</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-login">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="user@example.com" />
          <mat-error *ngIf="form.get('email')?.hasError('required')">
            Email obbligatoria
          </mat-error>

          <mat-error
            *ngIf="
              form.get('email')?.hasError('email') ||
              form.get('email')?.hasError('pattern')
            "
          >
            Email non valida
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            formControlName="password"
            placeholder="12345678"
          />
          <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
            <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">
            Password obbligatoria
          </mat-error>
        </mat-form-field>

        <div class="riga-pulsanti">
          <button mat-stroked-button type="button" (click)="submitOspite()">
            Entra come ospite
          </button>

          <button mat-raised-button color="primary" type="submit">
            Accedi
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
